<style>
  body {
    background: #0D0D0D;
    -webkit-font-smoothing: antialiased;
  }

  ::selection { background: #FFFFFF; color: #0D0D0D; }
  ::-moz-selection { background: #FFFFFF; color: #0D0D0D; }

  /* Lenis smooth scroll */
  html.lenis, html.lenis body { height: auto; }
  .lenis.lenis-smooth { scroll-behavior: auto !important; }
  .lenis.lenis-smooth [data-lenis-prevent] { overscroll-behavior: contain; }
  .lenis.lenis-stopped { overflow: hidden; }

  /* ---- Layout grid (identické s davidsalvet.cz) ---- */
  .col {
    width: 100%;
    margin-inline: auto;
    padding-inline: 30px;
  }
  @media (min-width: 768px) {
    .col { padding-inline: 64px; }
  }
  @media (min-width: 1280px) {
    .col {
      max-width: 864px;
      padding-inline: 0;
      margin-left: 264px;
      margin-right: auto;
    }
  }
  .bleed {
    width: 100%;
    margin-inline: auto;
    padding-inline: 30px;
  }
  @media (min-width: 768px) {
    .bleed { padding-inline: 64px; }
  }
  @media (min-width: 1280px) {
    .bleed { padding-inline: 70px; }
  }

  /* ---- Typography ---- */
  .t-hero {
    font-size: clamp(48px, 5.9vw, 76px);
    font-weight: 700;
    letter-spacing: -0.036em;
    line-height: 1.1;
  }
  .t-work {
    font-size: clamp(64px, 7.5vw, 96px);
    font-weight: 700;
    letter-spacing: -0.042em;
    line-height: 1;
  }
  .t-work--long {
    font-size: clamp(44px, 4.9vw, 70px);
  }
  .t-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    line-height: 1.8;
    text-transform: uppercase;
  }
  .sec-num {
    color: #6b6e74;
    margin-right: 12px;
    font-variant-numeric: tabular-nums;
  }
  .t-small {
    font-size: 14px;
    line-height: 1.8;
    letter-spacing: 0.02em;
  }

  /* ---- Staggered load-in ---- */
  @keyframes rise {
    from { opacity: 0; transform: translate3d(0, 22px, 0); }
    to   { opacity: 1; transform: translate3d(0, 0, 0); }
  }
  .rise {
    opacity: 0;
    animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  /* ---- Scroll reveal ---- */
  .reveal {
    opacity: 0;
    transform: translate3d(0, 26px, 0);
    transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1),
                transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .reveal.in {
    opacity: 1;
    transform: translate3d(0, 0, 0);
  }

  /* ---- Work rows (identické s davidsalvet.cz) ---- */
  .row-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: blur(3px);
    clip-path: inset(50% 0 50% 0);
    transform: scale(1.08);
    transition: clip-path 0.7s cubic-bezier(0.16, 1, 0.3, 1),
                transform 1.1s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .work-row:hover .row-img,
  .work-row:focus-visible .row-img {
    clip-path: inset(0 0 0 0);
    transform: scale(1.03);
  }
  .row-scrim {
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg,
      rgba(13, 13, 13, 0.82) 0%,
      rgba(13, 13, 13, 0.55) 45%,
      rgba(13, 13, 13, 0.25) 100%);
    opacity: 0;
    transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .work-row:hover .row-scrim,
  .work-row:focus-visible .row-scrim {
    opacity: 1;
  }
  .work-base {
    background-color: #080808;
    background-image:
      radial-gradient(120% 80% at 15% 0%,   rgba(255,255,255,0.05), transparent 60%),
      radial-gradient(90% 70%  at 85% 40%,  rgba(255,255,255,0.04), transparent 62%),
      radial-gradient(110% 90% at 40% 110%, rgba(255,255,255,0.03), transparent 58%);
  }

  /* ---- Full-width wrapper for the photo section ---- */
  .foto-wide {
    width: 100%;
    padding-inline: 30px;
  }
  @media (min-width: 768px) {
    .foto-wide { padding-inline: 64px; }
  }
  @media (min-width: 1280px) {
    .foto-wide { padding-inline: 264px; }
  }

  /* ---- Photo gallery (grid masonry) ---- */
  .gallery {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-auto-rows: 6px;
    gap: 14px;
  }
  @media (min-width: 768px) {
    .gallery { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
  }
  .g-item {
    display: block;
    width: 100%;
    padding: 0;
    border: 0;
    margin: 0;
    background: #0f0f10;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    grid-row-end: span 40;
  }
  .gallery:not(.masonry-ready) .g-item { grid-row: auto; aspect-ratio: 1 / 1; }
  .gallery:not(.masonry-ready) .g-item img { height: 100%; object-fit: cover; }
  .g-item img {
    display: block;
    width: 100%;
    height: auto;
    filter: grayscale(1) contrast(1.03);
    transform: scale(1.001);
    transition: filter 0.6s ease, transform 1.1s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .g-item::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(13,13,13,0.5), transparent 45%);
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  .g-item:hover img,
  .g-item:focus-visible img {
    filter: grayscale(0) contrast(1.03);
    transform: scale(1.05);
  }
  .g-item:hover::after,
  .g-item:focus-visible::after { opacity: 1; }
  .g-item .g-plus {
    position: absolute;
    right: 12px;
    bottom: 12px;
    width: 30px;
    height: 30px;
    display: grid;
    place-items: center;
    border-radius: 999px;
    background: rgba(255,255,255,0.14);
    backdrop-filter: blur(6px);
    color: #fff;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.45s ease, transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .g-item:hover .g-plus,
  .g-item:focus-visible .g-plus { opacity: 1; transform: translateY(0); }

  /* ---- Lightbox ---- */
  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 90;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6vw;
    background: rgba(8, 8, 8, 0.95);
    backdrop-filter: blur(8px);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.35s ease, visibility 0.35s ease;
  }
  .lightbox.open { opacity: 1; visibility: visible; }
  .lightbox figure {
    margin: 0;
    max-width: 100%;
    max-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .lightbox img {
    max-width: 100%;
    max-height: 82vh;
    object-fit: contain;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
  }
  .lb-btn {
    position: absolute;
    display: grid;
    place-items: center;
    width: 48px;
    height: 48px;
    border: 0;
    border-radius: 999px;
    background: rgba(255,255,255,0.08);
    color: #fff;
    cursor: pointer;
    transition: background 0.3s ease, transform 0.2s ease;
  }
  .lb-btn:hover { background: rgba(255,255,255,0.18); }
  .lb-btn:active { transform: scale(0.92); }
  .lb-close { top: 24px; right: 24px; }
  .lb-prev { left: 20px; top: 50%; transform: translateY(-50%); }
  .lb-next { right: 20px; top: 50%; transform: translateY(-50%); }
  .lb-prev:active, .lb-next:active { transform: translateY(-50%) scale(0.92); }
  .lb-counter {
    font-size: 12px;
    letter-spacing: 1px;
    color: #999da4;
    font-weight: 700;
  }
  @media (max-width: 640px) {
    .lb-prev { left: 10px; }
    .lb-next { right: 10px; }
    .lightbox { padding: 16px; }
  }

  /* ---- Grain / noise overlay ---- */
  .grain {
    position: fixed;
    inset: 0;
    z-index: 60;
    pointer-events: none;
    opacity: 0.055;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    background-size: 160px 160px;
  }

  /* ---- Scroll progress ---- */
  .scroll-progress {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    z-index: 70;
    pointer-events: none;
    transform: scaleX(0);
    transform-origin: 0 50%;
    background: #FFFFFF;
    will-change: transform;
  }

  :focus-visible {
    outline: 2px solid #FFFFFF;
    outline-offset: 4px;
    border-radius: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
    .rise, .reveal { opacity: 1; transform: none; }
    .grain { display: none; }
  }
</style>
</head>

<script>
  // ---- scroll reveal ----
  const io = new IntersectionObserver((entries) => {
    entries.forEach((e) => {
      if (e.isIntersecting) {
        e.target.classList.add('in');
        io.unobserve(e.target);
      }
    });
  }, { threshold: 0.15, rootMargin: '0px 0px -8% 0px' });
  document.querySelectorAll('.reveal').forEach((el) => io.observe(el));

  // ---- work backdrop darkens as the section scrolls past ----
  const workSec = document.getElementById('work');
  const workDim = document.querySelector('.work-dim');
  if (workSec && workDim && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    let queued = false;
    const paint = () => {
      queued = false;
      const r = workSec.getBoundingClientRect();
      const travel = r.height - window.innerHeight;
      const p = travel > 0 ? Math.min(1, Math.max(0, -r.top / travel)) : 0;
      workDim.style.opacity = (p * 0.8).toFixed(3);
    };
    const onScroll = () => {
      if (queued) return;
      queued = true;
      requestAnimationFrame(paint);
    };
    addEventListener('scroll', onScroll, { passive: true });
    addEventListener('resize', onScroll);
    paint();
  }

  // ---- scroll progress ----
  const progress = document.getElementById('progress');
  if (progress) {
    let pQueued = false;
    const paintProgress = () => {
      pQueued = false;
      const doc = document.documentElement;
      const max = doc.scrollHeight - doc.clientHeight;
      const p = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
      progress.style.transform = 'scaleX(' + p.toFixed(4) + ')';
    };
    addEventListener('scroll', () => {
      if (pQueued) return;
      pQueued = true;
      requestAnimationFrame(paintProgress);
    }, { passive: true });
    addEventListener('resize', paintProgress);
    paintProgress();
  }

  // ---- gallery grid masonry (row-major, dopočet výšek) ----
  const gallery = document.querySelector('.gallery');
  if (gallery) {
    const setSpans = () => {
      const cs = getComputedStyle(gallery);
      const rowH = parseFloat(cs.gridAutoRows) || 6;
      const gap  = parseFloat(cs.rowGap) || 14;
      gallery.querySelectorAll('.g-item').forEach((item) => {
        const img = item.querySelector('img');
        const h = img && img.naturalWidth
          ? img.getBoundingClientRect().width * (img.naturalHeight / img.naturalWidth)
          : item.getBoundingClientRect().height;
        item.style.gridRowEnd = 'span ' + Math.max(1, Math.round((h + gap) / (rowH + gap)));
      });
      gallery.classList.add('masonry-ready');
    };
    const imgs = [...gallery.querySelectorAll('img')];
    let pending = imgs.length;
    const done = () => { if (--pending <= 0) setSpans(); };
    if (!pending) setSpans();
    imgs.forEach((img) => { if (img.complete && img.naturalWidth) done(); else { img.addEventListener('load', () => { setSpans(); }, { once: true }); img.addEventListener('error', done, { once: true }); } });
    let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(setSpans, 150); });
  }

  // ---- photo gallery lightbox ----
  const items = [...document.querySelectorAll('.g-item')];
  const lb = document.getElementById('lightbox');
  if (items.length && lb) {
    const lbImg = document.getElementById('lb-img');
    const lbCur = document.getElementById('lb-current');
    const lbTot = document.getElementById('lb-total');
    const sources = items.map((b) => ({ src: b.dataset.src, alt: b.querySelector('img').alt }));
    let idx = 0;
    lbTot.textContent = sources.length;

    const show = (i) => {
      idx = (i + sources.length) % sources.length;
      lbImg.src = sources[idx].src;
      lbImg.alt = sources[idx].alt;
      lbCur.textContent = idx + 1;
    };
    const open = (i) => {
      show(i);
      lb.classList.add('open');
      document.body.style.overflow = 'hidden';
      if (window.__lenis) window.__lenis.stop();
    };
    const close = () => {
      lb.classList.remove('open');
      document.body.style.overflow = '';
      if (window.__lenis) window.__lenis.start();
    };

    items.forEach((b, i) => b.addEventListener('click', () => open(i)));
    lb.querySelector('.lb-close').addEventListener('click', close);
    lb.querySelector('.lb-prev').addEventListener('click', () => show(idx - 1));
    lb.querySelector('.lb-next').addEventListener('click', () => show(idx + 1));
    lb.addEventListener('click', (e) => { if (e.target === lb) close(); });
    addEventListener('keydown', (e) => {
      if (!lb.classList.contains('open')) return;
      if (e.key === 'Escape') close();
      else if (e.key === 'ArrowLeft') show(idx - 1);
      else if (e.key === 'ArrowRight') show(idx + 1);
    });
  }

  document.getElementById('year').textContent = new Date().getFullYear();
</script>

<!-- Lenis smooth scroll (self-hosted UMD) -->
<script src="js/lenis.min.js"></script>
<script>
  (function () {
    var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce || typeof Lenis !== 'function') return;
    var lenis = new Lenis({ lerp: 0.09, wheelMultiplier: 1, smoothWheel: true });
    window.__lenis = lenis;
    function raf(time) { lenis.raf(time); requestAnimationFrame(raf); }
    requestAnimationFrame(raf);
  })();
</script>
